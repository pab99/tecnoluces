<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantIA Stagelights - Monitor de Escenario</title>
    <!-- Librería para inyectar el QR dinámico -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 🟩 CHROMA GREEN KEY ORIGINAL PARA TRANSMISIÓN / OBS */
        body {
            background-color: #00ff00;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        /* CONTENEDOR EN CAPA MAESTRA */
        .overlay-box {
            background-color: rgba(13, 13, 19, 0.95);
            border: 4px solid #ffffff;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 90%;
            max-width: 650px;
        }

        /* BRANDING LOGO INTEGRADO */
        .logo-title {
            background-color: #ffffff;
            padding: 10px 30px;
            border-radius: 12px;
            color: #000000;
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .logo-title .ia { font-weight: bold; }
        .logo-title .i-red { color: #ff0000; font-weight: bold; font-style: italic; }
        .logo-title .a-blue { color: #0000ff; font-weight: bold; }

        /* CONTADOR GIGANTE */
        .counter-badge {
            font-family: monospace;
            font-size: 3.5rem;
            font-weight: bold;
            color: #00ff00;
            background: #000000;
            border: 2px solid #00ff00;
            padding: 15px 40px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            letter-spacing: 2px;
        }

        /* CUADRO DEL CÓDIGO QR */
        .qr-wrapper {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            display: inline-block;
        }

        .instruction-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.5;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div class="overlay-box">
        <!-- Logo Oficial Sincronizado -->
        <div class="logo-title">
            Sant<span class="ia"><span class="i-red">I</span><span class="a-blue">A</span></span> Stagelights
        </div>

        <p class="instruction-text">¡Escaneá el código QR con tu celular<br>y sé parte de los efectos en vivo!</p>

        <!-- Generador del QR -->
        <div class="qr-wrapper">
            <div id="scannable-qrcode"></div>
        </div>

        <!-- Indicador de audiencia en tiempo real -->
        <div class="counter-badge" id="live-display">👥 EN LÍNEA: --</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });
        const liveDisplay = document.getElementById('live-display');

        socket.on('connect', () => {
            liveDisplay.textContent = "👥 EN LÍNEA: 0";
        });

        // Escucha el conteo real del servidor
        socket.on('usuariosConectados', (total) => {
            // Descontamos 2 (La consola Admin y este monitor) para reflejar solo celulares de la audiencia
            const publicoNeto = Math.max(0, total - 2);
            liveDisplay.textContent = `👥 EN LÍNEA: ${publicoNeto}`;
        });

        // Autogeneración del QR apuntando dinámicamente a la URL base de tu Render
        try {
            if (typeof QRCode !== 'undefined') {
                new QRCode(document.getElementById("scannable-qrcode"), {
                    text: window.location.origin,
                    width: 250,
                    height: 250,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        } catch (error) {
            console.error("Error inicializando el QR:", error);
        }
    </script>
</body>
</html>
