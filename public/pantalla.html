<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantIA Show - Monitor de Audiencia en Vivo</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at center, #1e1e2f 0%, #0f0f16 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .monitor-card {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            max-width: 90%;
            width: 600px;
        }

        h1 {
            font-size: 1.8rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        h1 span {
            color: #3b82f6;
            font-weight: 800;
        }

        /* 📱 CONTADOR EN GIGANTE */
        .contador-gigante {
            font-size: 10rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 12px rgba(29, 78, 216, 0.3));
            margin-bottom: 15px;
            animation: pulse 2s infinite alternate;
        }

        .label-dispositivos {
            font-size: 1.4rem;
            color: #34d399;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Indicador parpadeante de señal en vivo */
        .live-dot {
            width: 12px;
            height: 12px;
            background-color: #34d399;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #34d399;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="monitor-card">
        <h1>Audiencia <span>SantIA Show</span></h1>
        
        <div class="contador-gigante" id="total-celulares">0</div>
        
        <div class="label-dispositivos">
            <span class="live-dot"></span> CONECTADOS EN VIVO
        </div>
    </div>

    <script>
        // Al omitir la URL, se auto-conecta al dominio de Render actual de manera nativa
        const socket = io();

        // Escuchamos el conteo en tiempo real del servidor
        socket.on('usuariosConectados', (total) => {
            document.getElementById('total-celulares').textContent = total;
        });
    </script>
</body>
</html>
