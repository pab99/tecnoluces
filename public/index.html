<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantIA Show - Control Interactivos</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #0f0f16;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        h1 span {
            color: #3b82f6;
        }

        p.subtitle {
            color: #9ca3af;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        /* 🔘 BOTONES INTERACTIVOS DEL SHOW */
        .grid-botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-show {
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            color: #ffffff;
        }

        .btn-show:active {
            transform: scale(0.95);
        }

        .btn-azul { background-color: #1d4ed8; }
        .btn-rojo { background-color: #dc2626; }
        .btn-verde { background-color: #16a34a; }
        .btn-amarillo { background-color: #ca8a04; color: #000000; }

        /* SECCIÓN DEL BOMBO */
        .bombo-box {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 25px;
            margin-top: 10px;
        }

        .btn-bombo {
            width: 100%;
            padding: 25px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            font-size
